<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <rect width="16" height="16" rx="3" fill="#07080a"/>
  <rect x="1" y="1" width="14" height="14" rx="2" fill="#0c0e12"/>
  <!-- Alaska -->
  <rect x="2" y="5" width="2" height="3" fill="#8b93a0"/>
  <!-- Canada / northern US, ice-gray -->
  <rect x="4" y="3" width="7" height="2" fill="#c9d2dc"/>
  <rect x="4" y="5" width="1" height="2" fill="#c9d2dc"/>
  <rect x="5" y="5" width="8" height="2" fill="#c9d2dc"/>
  <!-- Interior: three sport-colored claimed tiles (hockey red, basketball orange, football navy) -->
  <rect x="5" y="7" width="1" height="2" fill="#c9d2dc"/>
  <rect x="6" y="7" width="2" height="2" fill="#c8102e"/>
  <rect x="8" y="7" width="3" height="2" fill="#c9d2dc"/>
  <rect x="11" y="7" width="3" height="2" fill="#f78f1e"/>
  <!-- Southern US -->
  <rect x="5" y="9" width="2" height="2" fill="#eef2f6"/>
  <rect x="7" y="9" width="3" height="2" fill="#002244"/>
  <rect x="10" y="9" width="2" height="2" fill="#eef2f6"/>
  <!-- Florida / gulf -->
  <rect x="6" y="11" width="5" height="1" fill="#eef2f6"/>
  <rect x="7" y="12" width="3" height="1" fill="#eef2f6"/>
  <rect x="9" y="13" width="1" height="1" fill="#eef2f6"/>
</svg>
